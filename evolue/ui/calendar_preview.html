<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendar · Évolué</title>
<style>
  :root{
    --ink:#7A8084; --muted:#8B9195; --quiet:#A9AEB2; --line:#CDD1D4; --soft:#fafbfb;
    --pink:#f9eff2; --pink-line:#f0d8df; --pink-ink:#7b4d55;
    --green:#dfeee2; --green-line:#c3ddc9; --green-ink:#3f6b4a;
    --amber:#fbf1d5; --amber-line:#ecdcae; --amber-ink:#8a6b23;
  }
  *{box-sizing:border-box}html,body{margin:0;background:#fff;color:var(--ink);font-family:"Jost","Segoe UI",sans-serif}
  a{color:inherit;text-decoration:none}
  .header{position:sticky;top:0;z-index:20;border-bottom:1px solid #e0e7ec;background:rgba(255,255,255,.96);backdrop-filter:blur(8px)}
  .header-inner{max-width:1400px;height:74px;margin:auto;padding:0 44px;display:flex;align-items:center;justify-content:space-between;gap:32px}
  .brand{font-size:26px;font-weight:200}
  .nav{display:flex;overflow-x:auto}.nav a{padding:10px 14px;color:#8f969b;font:500 11px "Archivo","Segoe UI",sans-serif;letter-spacing:.18em;text-transform:uppercase;white-space:nowrap}.nav .active{border-bottom:2px solid var(--ink);color:var(--ink)}
  main{max-width:1400px;margin:auto;padding:42px 44px 80px}
  .crumb{display:flex;justify-content:space-between;gap:20px;padding-bottom:18px;border-bottom:1px solid var(--line);color:var(--quiet);font-size:10px;letter-spacing:.18em}
  .hero{padding:30px 0 34px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
  .eye{color:var(--quiet);font-size:10px;letter-spacing:.2em}.hero h1{margin:10px 0 0;font-size:48px;font-weight:200}.hero p{max-width:650px;margin:12px 0 0;color:var(--muted);font-size:15px;font-weight:300}
  .arrows{display:flex;gap:6px}.arrow{padding:10px 13px;border:1px solid var(--line);background:#f2f3f4;font:600 9px "Archivo",sans-serif;letter-spacing:.13em}
  .week-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:10px}
  .week-card{border:1px solid var(--line);background:var(--soft);min-width:0}
  .week-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
  .week-head b{font:600 10px "Archivo",sans-serif;letter-spacing:.14em;text-transform:uppercase}
  .week-title{padding:12px 14px;font-size:18px;font-weight:300;line-height:1.4;min-height:64px}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--line)}
  .tile{aspect-ratio:4/5;border-right:1px solid var(--line);border-bottom:1px solid var(--line);position:relative;display:flex;align-items:center;justify-content:center;font:600 8px "Archivo",sans-serif;letter-spacing:.1em}
  .tile:nth-child(3n){border-right:0}
  /* light-green checkmark on APPROVED tiles (A.4.b) */
  .tile.approved{background:var(--green);color:var(--green-ink)}
  .tile.approved .check{position:absolute;top:6px;right:7px;width:16px;height:16px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
  .tile .no{position:absolute;bottom:6px;left:7px}
  .week-foot{padding:9px 14px;color:var(--quiet);font:500 9px "Archivo",sans-serif;letter-spacing:.12em;text-transform:uppercase}
  footer{max-width:1400px;margin:auto;padding:26px 44px;border-top:1px solid var(--line);color:#b4babe;font:500 10px "Archivo",sans-serif;letter-spacing:.2em;text-transform:uppercase}
</style>
</head>
<body>
  <header class="header"><div class="header-inner">
    <div class="brand">Évolué</div>
    <nav class="nav">
      <a href="/calendar" class="active">Calendar</a><a href="/library">Library</a><a href="/approvals">Approvals</a><a href="/publishing">Publishing</a><a href="/history">History</a>
    </nav>
  </div></header>
  <main>
    <div class="crumb"><span>Calendar · owned by Jean</span><button onclick="window.history.back()">Back</button></div>
    <section class="hero">
      <div><div class="eye">Plan two years ahead</div><h1>Calendar</h1><p>Write the weekly THEME for up to 52 weeks ahead. Tiles turn light-green when approved and queue for publishing.</p></div>
      <div class="arrows"><span class="arrow">← 9 wks</span><span class="arrow">9 wks →</span></div>
    </section>
    <div class="week-grid" id="grid"></div>
  </main>
  <footer>Évolué Media Team · Calendar</footer>
  <script>
    const THEMES = ["The Moon Is The Oldest Lantern", "Exfoliate For Fall", "The Warm Tingle Of The Dark", "Winter Light"];
    const grid = document.getElementById('grid');
    for (let w=43; w>=36; w--){
      const card = document.createElement('div'); card.className='week-card';
      card.innerHTML = `
        <div class="week-head"><b>WEEK ${w}</b><span class="week-title" contenteditable placeholder="Theme…">${THEMES[Math.abs(w)%THEMES.length]||''}</span></div>
        <div class="tiles">
          ${[1,2,3,4,5,6,7,8,9].map(i=>`<div class="tile ${(w===39&&i<=5)||i===8?'approved':''}" data-t="${i}"><span class="no">${i}</span>${(w===39&&i<=5)||i===8?'<span class="check"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg></span>':''}</div>`).join('')}
        </div>
        <div class="week-foot">${w===39?'Approved tiles queue for publishing':''}</div>`;
      grid.appendChild(card);
    }
  </script>
</body>
</html>
