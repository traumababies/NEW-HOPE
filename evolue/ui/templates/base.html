<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Évolué{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/evolue.css">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="/calendar" class="brand">Évolué</a>
      <nav class="nav">
        <a href="/calendar" class="{% if active_nav == 'calendar' %}active{% endif %}">Calendar</a>
        <a href="/library" class="{% if active_nav == 'library' %}active{% endif %}">Library</a>
        <a href="/approvals" class="{% if active_nav == 'approvals' %}active{% endif %}">Approvals</a>
        <a href="/media-editor" class="{% if active_nav == 'media_editor' %}active{% endif %}">Media Editor</a>
        <a href="/publishing" class="{% if active_nav == 'publishing' %}active{% endif %}">Publishing</a>
        <a href="/history" class="{% if active_nav == 'history' %}active{% endif %}">History</a>
        <a href="/learning" class="{% if active_nav == 'learning' %}active{% endif %}">Learning</a>
        <a href="/settings/brand" class="{% if active_nav == 'settings' %}active{% endif %}">Settings</a>
      </nav>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <span>Évolué Media Team</span>
    <span>{% block footer_right %}{% endblock %}</span>
  </footer>

  <aside class="ai-panel" id="aiPanel">
    <h3>AI Team</h3>
    <div id="aiPanelContent">
      {% block ai_panel %}{% endblock %}
    </div>
  </aside>
  <button class="ai-panel-toggle" onclick="document.getElementById('aiPanel').classList.toggle('open')">🤖</button>

  {% block scripts %}{% endblock %}
</body>
</html>
